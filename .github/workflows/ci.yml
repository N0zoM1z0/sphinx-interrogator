name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff format --check python tests/python scripts
      - run: uv run --frozen ruff check python tests/python scripts
      - run: uv run --frozen mypy python
      - name: Bootstrap pinned TLC
        run: |
          mkdir -p .tools
          curl --fail --location --silent --show-error \
            --output .tools/tla2tools-1.7.4.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          printf '%s  %s\n' \
            '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88' \
            '.tools/tla2tools-1.7.4.jar' | sha256sum --check
      - run: uv run --frozen pytest tests/python -m "not integration"
      - run: uv run --frozen python scripts/validate_schemas.py
      - run: uv run --frozen python scripts/check_markdown_links.py
      - run: uv run --frozen python scripts/check_formal_scaffold.py

  integration:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
      SPHINX_VM_BINARY: target/debug/sphinx-vm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: cargo build --locked --bin sphinx-vm
      - run: uv run --frozen pytest tests/python -m integration
      - run: uv run --frozen python scripts/boundary_audit.py

  release-smoke:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
      SPHINX_VM_BINARY: target/debug/sphinx-vm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: cargo build --locked --bin sphinx-vm
      - name: Generate standard-profile audit
        run: uv run --frozen python scripts/audit_standard_profile.py --output runs/standard-profile-audit-m7
      - name: Run tutorial smoke
        run: uv run --frozen python scripts/demo_tutorial.py
      - name: Run standard benchmark smoke
        run: >
          uv run --frozen python scripts/benchmark_standard.py
          --output runs/standard-benchmark-v2
          --socket-root /tmp/sphinx-standard-sockets
          --smoke
          --bootstrap-samples 100
      - name: Run M8 state-learning smoke
        run: uv run --frozen python scripts/evaluate_state_learning.py --output runs/state-learning-m8
      - name: Run M9 reducer smoke
        run: >
          uv run --frozen python scripts/reduce_witnesses.py
          --output runs/reduced-witnesses-m9
          --socket-root /tmp/sphinx-reducer-sockets
          --require-all-minimized
      - name: Export release evaluation artifacts
        run: uv run --frozen python scripts/export_evaluation_artifacts.py --output runs/release-m9/evaluation-artifacts
      - name: Build release manifest smoke
        run: uv run --frozen python scripts/release_manifest.py --output runs/release-m9/release-manifest.json
      - name: Assert release manifest smoke semantics
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("runs/release-m9/release-manifest.json").read_text())
          checks = {item["name"]: item["status"] for item in manifest["release_checks"]}
          assert manifest["summary"]["artifact_count"] == 5
          assert manifest["summary"]["all_present"] is True
          assert manifest["status"] == "blocked"
          assert checks["standard.full_published_matrix"] == "fail"
          assert checks["tutorial.unique_exact"] == "pass"
          assert checks["m8.state_conditioned_secret_inference"] == "pass"
          assert checks["m9.reducer_replay_paths_valid"] == "pass"
          assert checks["evaluation_artifacts.required_files"] == "pass"
          PY
