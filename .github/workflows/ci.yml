name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff format --check python tests/python scripts
      - run: uv run ruff check python tests/python scripts
      - run: uv run mypy python
      - run: uv run pytest tests/python
      - run: uv run python scripts/validate_schemas.py
      - run: uv run python scripts/check_markdown_links.py
      - run: uv run python scripts/check_formal_scaffold.py
