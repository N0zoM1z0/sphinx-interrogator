[package]
name = "sphinx-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Synthetic microcoded VM for relational-interrogation research"

[lib]
name = "sphinx_vm"
path = "src/lib.rs"

[[bin]]
name = "sphinx-vm"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.23", features = ["derive"] }
getrandom = "=0.2.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"

[lints]
workspace = true
