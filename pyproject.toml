[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sphinx-interrogator"
version = "0.1.0"
description = "Relational interrogation and synthesis for a deliberately leaky synthetic VM"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Sphinx Interrogator contributors" }]
dependencies = [
  "aalpy>=1.5,<2",
  "click>=8.1,<9",
  "jsonschema>=4.23,<5",
  "numpy>=2.1,<3",
  "pydantic>=2.9,<3",
  "rich>=13.9,<14",
  "z3-solver>=4.13,<5",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.115,<7",
  "mypy>=1.12,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[project.scripts]
sphinx-interrogate = "sphinx_interrogator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/sphinx_interrogator"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests/python"]
markers = [
  "integration: launches the separately built SphinxVM process",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python", "tests/python", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "python"
packages = ["sphinx_interrogator"]
